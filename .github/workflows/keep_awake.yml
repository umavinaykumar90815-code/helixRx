name: Keep HelixRx Awake

# Define when this workflow will run
on:
  schedule:
    # Runs at minute 0 of every hour (24 times a day)
    - cron: '0 * * * *'
  # Allows you to run this manually from the Actions tab for testing
  workflow_dispatch:

jobs:
  ping_site:
    runs-on: ubuntu-latest
    steps:
      - name: Visit Website
        run: |
          curl -s https://helixrx-pgx.streamlit.app/ > /dev/null
          echo "Website pinged successfully at $(date)"